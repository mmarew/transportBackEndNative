<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Test</title>
  </head>
  <body>
    <h1>WebSocket Client</h1>
    <div>
      <h2>Messages:</h2>
      <ul id="messagesList"></ul>
    </div>
    <div class="latAndLng"></div>
    <script>
      const phoneNumber = "0922112480"; // Replace with the actual phone number
      const hostServer = `wss://transport.digitalmegazen.com`;
      const hostLocal = `ws://localhost:3000`;
      let ws;

      function connectWebSocket() {
        const token = `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJkYXRhIjp7InBob25lTnVtYmVyIjoiMDkyMjExMjQ4MCIsInR5cGUiOiJTTVNTZW5kZXIifSwiaWF0IjoxNzI4MzgxMDc4fQ.gI3z1-01z1ywhmBzNDQKt2TOCzQwHfhiLhUyCasnTSY`;
        ws = new WebSocket(
          `${hostLocal}?phoneNumber=${phoneNumber}&user=SMSSender&password=123&token=${token}`
        );

        ws.addEventListener("open", () => {});

        ws.addEventListener("message", (event) => {
          console.log("Message from server:", event.data);
          const messagesList = document.getElementById("messagesList");
          const newMessage = document.createElement("li");
          newMessage.textContent = event.data;
          messagesList.appendChild(newMessage);
        });

        ws.addEventListener("close", () => {
          console.log(
            "Disconnected from WebSocket server. Attempting to reconnect..."
          );
          setTimeout(connectWebSocket, 5000); // Attempt to reconnect after 5 seconds
        });

        ws.addEventListener("error", (error) => {
          console.log("WebSocket error:", error);
          ws.close(); // Close the WebSocket connection and trigger reconnection
        });
      }

      function getCurrentLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const latitude = position.coords.latitude;
              const longitude = position.coords.longitude;
              document.getElementsByClassName(
                "latAndLng"
              )[0].innerHTML = `You are in Latitude: ${latitude}, Longitude: ${longitude}`;
              console.log(`Latitude: ${latitude}, Longitude: ${longitude}`);
            },
            (error) => {
              console.log(`Error Code = ${error.code} - ${error.message}`);
            }
          );
        } else {
          console.log("Geolocation is not supported by this browser.");
        }
      }

      // Start the WebSocket connection
      connectWebSocket();

      // Get the current location
      getCurrentLocation();
    </script>
  </body>
</html>
