<!DOCTYPE html>
<html>
  <head>
    <title>Place Autocomplete with Latitude and Longitude</title>
    <style>
      #map {
        height: 300px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Search for a Place</h1>
    <input id="autocomplete" type="text" placeholder="Enter a place name" />
    <div id="result"></div>
    <div id="map"></div>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBLDRYEPAjj6icOZKVtafjb4Gls2IYSUsU&libraries=places"></script>
    <script>
      let map;
      let autocomplete;

      function initMap() {
        // Initialize map
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 9.0144768, lng: 38.8005888 }, // Default to Addis Ababa
          zoom: 10,
        });

        // Initialize autocomplete
        autocomplete = new google.maps.places.Autocomplete(
          document.getElementById("autocomplete"),
          { types: ["geocode"] } // Restrict to address types
        );

        // Add listener to handle place selection
        autocomplete.addListener("place_changed", onPlaceChanged);
      }

      function onPlaceChanged() {
        const place = autocomplete.getPlace();

        if (!place.geometry) {
          document.getElementById("result").innerHTML =
            "No details available for input: '" + place.name + "'";
          return;
        }

        const lat = place.geometry.location.lat();
        const lng = place.geometry.location.lng();

        // Update the map
        map.setCenter(place.geometry.location);
        map.setZoom(15);

        // Add marker
        new google.maps.Marker({
          position: place.geometry.location,
          map: map,
        });

        // Display latitude and longitude
        document.getElementById(
          "result"
        ).innerHTML = `Latitude: ${lat}, Longitude: ${lng}`;
      }

      // Load the map and autocomplete when the page loads
      window.onload = initMap;
    </script>
  </body>
</html>
