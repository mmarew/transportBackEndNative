<!DOCTYPE html>
<html>
  <body>
    <h1>My First Google Map</h1>
    <div id="googleMap" style="width: 100%; height: 800px"></div>

    <script>
      // Function to get the current position using Geolocation API
      const getCurrentPosition = () => {
        return new Promise((resolve, reject) => {
          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                resolve(position.coords);
              },
              (error) => {
                reject(
                  new Error("Error retrieving location: " + error.message)
                );
              },
              {
                enableHighAccuracy: true, // Use GPS for higher accuracy
                timeout: 5000, // Wait up to 5 seconds for location
                maximumAge: 0, // Prevent using cached location
              }
            );
          } else {
            reject(new Error("Geolocation is not supported by this browser."));
          }
        });
      };

      // Function to initialize the map
      async function myMap() {
        try {
          // Await the user's location
          const { latitude, longitude } = await getCurrentPosition();
          console.log(`Latitude: ${latitude}, Longitude: ${longitude}`);

          // Map properties with the user's location
          const mapProp = {
            center: new google.maps.LatLng(latitude, longitude),
            zoom: 15,
          };

          // Render the map
          const map = new google.maps.Map(
            document.getElementById("googleMap"),
            mapProp
          );
        } catch (error) {
          console.error(error.message);
        }
      }
    </script>

    <!-- Load Google Maps API -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBLDRYEPAjj6icOZKVtafjb4Gls2IYSUsU&callback=myMap"
      async
      defer
    ></script>
    <script>
      const calculateAge = (birthDate) => {
        const birth = new Date(birthDate); // Parse the input date
        const today = new Date(); // Get today's date

        let age = today.getFullYear() - birth.getFullYear(); // Calculate year difference
        const monthDifference = today.getMonth() - birth.getMonth();
        const dayDifference = today.getDate() - birth.getDate();

        // Adjust age if the current month/day is before the birth month/day
        if (
          monthDifference < 0 ||
          (monthDifference === 0 && dayDifference < 0)
        ) {
          age--;
        }

        return age;
      };
      //   console.log(calculateAge("1980-01-01"));
      const fullInformation = (fullName, birthDate, ageDetecter) => {
        fullInfo =
          "Fullname=" +
          fullName +
          "<br>BirthDate=" +
          birthDate +
          "<br>Age=" +
          ageDetecter(birthDate);
        return fullInfo;
      };
      console.log(fullInformation("John Doe", "1980-01-01", calculateAge));
    </script>
  </body>
</html>
